[package]
name = "httpcat"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
description = "An HTTP debug tool that prints details of incoming HTTP requests"
license = "MIT"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
